name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  migrations:
    # Applies every migration to a fresh Postgres so a broken SQL file fails the PR.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: capsteal
          POSTGRES_USER: capsteal
          POSTGRES_PASSWORD: capsteal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U capsteal"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations in order
        env:
          PGPASSWORD: capsteal
        run: |
          for f in $(ls db/migrations/V*.sql | sort -V); do
            echo "Applying $f"
            psql -h localhost -U capsteal -d capsteal -v ON_ERROR_STOP=1 -f "$f"
          done
